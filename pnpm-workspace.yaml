packages:
  - 'shared'
  - 'backend'
  - 'frontend'

# https://pnpm.io/settings — pnpm 12.x 起 **配置唯一入口就是本文件**。

# ⚠️⚠️ 关键实测项：本机 pnpm 12.4.2 **完全不读 .npmrc**（`pnpm config list` 证明其中键未生效）。
#   由此引出的两个坑（docs/06 §六 施工纪律 · 环境限制）：
#   ① 任何设置写进 .npmrc 都是无效的，必须落在本文件；
#   ② 默认的 isolated 布局在本机**静默失败** —— install 报成功、store 内容完整，但
#      shared|backend|frontend/node_modules 下只剩空目录（符号链接未建立），
#      构建时才暴露 Cannot find module .../typescript/bin/tsc。
#      本机 symlink/junction 手工创建正常，--force 与 --loglevel=debug 均无告警。
#   故改用 hoisted 布局：依赖扁平提升到根 node_modules，不做逐包符号链接。
#   取舍：各包仍严格声明自己的直接依赖，workspace 协议不受影响；仅失去 pnpm 默认的
#        「符号链接严格性」防幽灵依赖保护（单人小团队项目可接受）。
#   若将来 CI（Linux）上 isolated 正常，可删掉 nodeLinker 一行切回默认，代码无需改动。
nodeLinker: hoisted

# 依赖提升策略：提升到根，避免嵌套过深
resolutionMode: highest

# workspace 协议（显式声明，避免依赖默认值变化）
linkWorkspacePackages: true
preferWorkspacePackages: true

# 本项目 Node 只有 v22，无历史包袱；上游包 peer 范围常滞后，不强制失败
strictPeerDependencies: false

# 依赖生命周期脚本白名单（pnpm 10+ 安全机制：默认阻止 postinstall，防供应链攻击）。
# 未放行的包会让 install 直接以 ERR_PNPM_IGNORED_BUILDS 报错退出（是错误，不是警告）。
#
# 现列：
# - esbuild：vite / tsx 的底层打包器，需 postinstall 落平台二进制。
# - prisma：CLI 自带 `preinstall`（平台探测）；@prisma/engines 自带 postinstall。
#   ⚠️ P0-1-5 实测：这两个不登记时 `pnpm add prisma` 直接以
#      `ERR_PNPM_IGNORED_BUILDS: Ignored build scripts: @prisma/engines@7.10.0, prisma@7.10.0`
#      失败退出（是错误，不是警告）—— 与 esbuild 同款机制。
# - bcrypt：install 脚本是 `node-gyp-build`（P0-1-6 的密码哈希）。它**不需要编译器** ——
#   包内自带 `prebuilds/`（darwin-arm64 / win32-x64 / linux-x64 glibc+musl 全都有），
#   node-gyp-build 只是把对应平台的 .node 挑出来；但脚本本身仍受本白名单管辖。
# - ssh2 / protobufjs（P0-3-2 加 dockerode 时牵进来的）：
#   · `ssh2` 是 `docker-modem` 的硬依赖，但只在 `DOCKER_HOST=ssh://…` 时才用得上 ——
#     我们**只用 unix socket 连本机 daemon**（走 socket 还是 shell out，见 backend/src/sandbox/docker.ts）。
#     它的 install 脚本在本机会真的编译一个**可选**的原生 crypto 绑定（P0-3-2 实测：`sshcrypto.node`
#     构建成功）⇒ 登记 `false` 让没有编译器的机器也能装得上；纯 JS 回落路径完整，我们一行都不走。
#   · `cpu-features` 是 `ssh2` 的**可选**依赖，install 脚本是 `node-gyp rebuild` ⇒ 同样 `false`。
#     ⚠️ 别把这两个改成 true：那会让每一台没有 Xcode CLT / python 的机器在 `pnpm install` 时失败，
#     换来的是两个我们永远用不到的原生模块。
#   · `protobufjs` 的 postinstall 只是给它的 cli 打点，无副作用 ⇒ 放行。
# 后续引入原生依赖（如 onnxruntime-node，P0-1-13）时在此追加。
allowBuilds:
  esbuild: true
  prisma: true
  '@prisma/engines': true
  bcrypt: true
  protobufjs: true
  ssh2: false
  cpu-features: false
  # tesseract.js（P0-4-x 文档图片解析引入）：npm 包**已自带构建好的 dist**，其生命周期脚本
  # 只是发布前的打包（prepare/prepublish），运行时不需要任何编译 ⇒ 与 ssh2 同款登记 `false`
  # 阻止脚本执行，避免在无工具链的机器上多出一次无意义的构建。
  tesseract.js: false
minimumReleaseAgeExclude:
  - '@modelcontextprotocol/sdk@1.30.1'

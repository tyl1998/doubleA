packages:
  - 'shared'
  - 'backend'
  - 'frontend'

# https://pnpm.io/settings — pnpm 12.x 起 **配置唯一入口就是本文件**。

# ⚠️⚠️ 关键实测项：本机 pnpm 12.4.2 **完全不读 .npmrc**（`pnpm config list` 证明其中键未生效）。
#   由此引出的两个坑（docs/06 §六 施工纪律 · 环境限制）：
#   ① 任何设置写进 .npmrc 都是无效的，必须落在本文件；
#   ② 默认的 isolated 布局在本机**静默失败** —— install 报成功、store 内容完整，但
#      shared|backend|frontend/node_modules 下只剩空目录（符号链接未建立），
#      构建时才暴露 Cannot find module .../typescript/bin/tsc。
#      本机 symlink/junction 手工创建正常，--force 与 --loglevel=debug 均无告警。
#   故改用 hoisted 布局：依赖扁平提升到根 node_modules，不做逐包符号链接。
#   取舍：各包仍严格声明自己的直接依赖，workspace 协议不受影响；仅失去 pnpm 默认的
#        「符号链接严格性」防幽灵依赖保护（单人小团队项目可接受）。
#   若将来 CI（Linux）上 isolated 正常，可删掉 nodeLinker 一行切回默认，代码无需改动。
nodeLinker: hoisted

# 依赖提升策略：提升到根，避免嵌套过深
resolutionMode: highest

# workspace 协议（显式声明，避免依赖默认值变化）
linkWorkspacePackages: true
preferWorkspacePackages: true

# 本项目 Node 只有 v22，无历史包袱；上游包 peer 范围常滞后，不强制失败
strictPeerDependencies: false

# 依赖生命周期脚本白名单（pnpm 10+ 安全机制：默认阻止 postinstall，防供应链攻击）。
# 未放行的包会让 install 直接以 ERR_PNPM_IGNORED_BUILDS 报错退出（是错误，不是警告）。
#
# 现列：
# - esbuild：vite / tsx 的底层打包器，需 postinstall 落平台二进制。
# 后续引入原生依赖（如 onnxruntime-node，P0-1-13）时在此追加。
allowBuilds:
  esbuild: true
